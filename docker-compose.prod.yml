# Production compose: ใช้ image จาก GHCR (ไม่ build บน server)
# ใช้ MongoDB และ nginx ที่มีอยู่แล้วบน server (container ชื่อ "mongodb" บน network "mongodb_network")
# ไม่สร้าง mongo/caddy ของตัวเองอีกต่อไป
# วางไฟล์นี้ + .env ไว้ใน DEPLOY_PATH แล้วรัน:
#   docker compose -f docker-compose.prod.yml pull api
#   docker compose -f docker-compose.prod.yml up -d
services:
  api:
    image: ghcr.io/warunyoo1/running-event-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      UPLOAD_DIR: /app/uploads
      # api อยู่หลัง nginx (host) 1 ชั้น: ให้ rate limit เห็น IP จริงของผู้ใช้
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - uploads:/app/uploads
    # เฉพาะ loopback ของ server (nginx เข้าถึง api ผ่าน 127.0.0.1)
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    networks:
      - mongodb_network
networks:
  mongodb_network:
    external: true
volumes:
  uploads:
